[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argentina-markets-mcp"
version = "0.1.0"
description = "MCP server for Argentine market data plus a paper-trading agent with risk guardrails."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["mcp>=2.0"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
argentina-markets-mcp = "argentina_markets_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/argentina_markets_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
